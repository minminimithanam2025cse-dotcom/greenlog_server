<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Login - GreenLog</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">
            🌱
        </div>


        <!-- Title -->
        <h1 class="login-title">
            GreenLog
        </h1>

        <p class="login-subtitle">
            User Login
        </p>


        <!-- Login Form -->
        <form
            id="userLoginForm"
            class="login-form"
        >

            <!-- Username -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- User Information -->
            <div
                style="
                    font-size: 13px;
                    color: var(--text-light);
                    background: var(--primary-light);
                    padding: 10px 12px;
                    border-radius: 8px;
                "
            >
                👤 Users can view GreenLog information
                but cannot modify records.
            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="btn btn-primary btn-block btn-lg"
                id="loginButton"
            >
                👤 Login as User
            </button>

        </form>


        <!-- Footer -->
        <div class="login-footer">

            <a
                href="../index.html"
                class="text-primary"
            >
                ← Back to Home
            </a>

            <br><br>

            <span>
                Are you an administrator?
            </span>

            <br>

            <a
                href="admin-login.html"
                class="text-primary"
            >
                Login as Admin
            </a>

        </div>

    </div>

</div>


<!-- Toast -->
<div class="toast-container"></div>


<script src="../js/core.js"></script>

<script>

"use strict";


/* =========================================================
   USER LOGIN
   ========================================================= */

document
    .getElementById("userLoginForm")
    .addEventListener("submit", function (event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!username || !password) {

            toast(
                "Please enter username and password.",
                "warning"
            );

            return;
        }


        const button =
            document.getElementById("loginButton");


        button.disabled = true;

        button.innerHTML =
            "⏳ Signing in...";


        const result =
            A.login(
                username,
                password,
                "user"
            );


        if (result.success) {

            toast(
                "User login successful!",
                "success"
            );


            setTimeout(function () {

                window.location.href =
                    "../user/dashboard.html";

            }, 500);

        } else {

            toast(
                result.message,
                "error"
            );


            button.disabled = false;

            button.innerHTML =
                "👤 Login as User";
        }

    });

</script>

</body>
</html>
